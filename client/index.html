<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddgy</title>
    <!-- Sets data-theme before first paint, so styles/tokens.css's dark
         override block already applies by the time React mounts — avoids a
         flash of the wrong theme. Key ('buddgy_theme') must match
         src/constants/storageKeys.js's THEME_KEY. Light is the hard default —
         no prefers-color-scheme fallback — dark mode is opt-in only, via the
         in-app toggle. -->
    <script>
      (function () {
        var stored = localStorage.getItem('buddgy_theme');
        document.documentElement.dataset.theme = stored || 'light';
      })();
    </script>
    <!-- DM Mono only — money figures. Body text stays on the system sans
         stack (src/styles/tokens.css --font-sans); DM Sans has no Hebrew
         coverage. See docs/DASHBOARD-REDESIGN.md Step 1. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
